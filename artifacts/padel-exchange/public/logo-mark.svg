<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3050"/>
      <stop offset="100%" stop-color="#0b1825"/>
    </linearGradient>
    <filter id="sh" x="-8%" y="-8%" width="122%" height="122%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <!-- rounded square -->
  <rect x="4" y="4" width="92" height="92" rx="20" ry="20" fill="url(#bg)" filter="url(#sh)"/>
  <!-- P glyph — shifted left to leave room for superscript -->
  <text
    x="22" y="79"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-weight="900"
    font-size="60"
    letter-spacing="-3"
    fill="#F4F7FB"
  >P</text>
  <!-- 3 superscript -->
  <text
    x="65" y="44"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-weight="800"
    font-size="28"
    fill="#19C3B0"
  >3</text>
</svg>
