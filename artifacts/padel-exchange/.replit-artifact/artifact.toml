kind = "web"
previewPath = "/"
title = "The Padel Exchange"
version = "1.0.0"
id = "artifacts/padel-exchange"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24308

[services.development]
run = "pnpm --filter @workspace/padel-exchange run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/padel-exchange", "run", "build" ]
serve = "static"
publicDir = "artifacts/padel-exchange/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24308"
BASE_PATH = "/"
